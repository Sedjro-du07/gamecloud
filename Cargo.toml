[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/web",
    "crates/bot",
]

# crates/web is a hybrid lib (WASM hydrate target) + bin (Axum server target),
# orchestrated by cargo-leptos. The frontend and the server live in the same
# crate so component code can be `#[cfg(feature = "ssr")]`-guarded and shared
# between SSR and hydration without duplication.

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.80"
license     = "MIT"
authors     = ["GameCloud Team <gamecloud@epitech.eu>"]
repository  = "https://github.com/gamecloud-os/gamecloud-os"

[workspace.dependencies]
# --- shared internal -------------------------------------------------------
gamecloud-shared = { path = "crates/shared" }

# --- async / runtime ------------------------------------------------------
tokio       = { version = "1.42", features = ["full"] }
futures     = "0.3"
async-trait = "0.1"

# --- error handling -------------------------------------------------------
thiserror = "2.0"
anyhow    = "1.0"

# --- serialization --------------------------------------------------------
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- time / ids -----------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde", "js"] }

# --- crypto / auth --------------------------------------------------------
jsonwebtoken = "9.3"
oauth2       = "4.4"
hmac         = "0.12"
sha2         = "0.10"
rand         = "0.8"
argon2       = "0.5"
base64       = "0.22"

# --- http / web -----------------------------------------------------------
axum        = { version = "0.8", features = ["macros", "ws", "multipart"] }
axum-extra  = { version = "0.10", features = ["cookie", "cookie-private", "typed-header"] }
tower       = { version = "0.5", features = ["full"] }
tower-http  = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip", "limit"] }
http        = "1.2"
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# --- database -------------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

# --- logging / tracing ----------------------------------------------------
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- email ----------------------------------------------------------------
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }

# --- misc -----------------------------------------------------------------
qrcode      = "0.14"
image       = { version = "0.25", default-features = false, features = ["png"] }
octocrab    = "0.42"
validator   = { version = "0.19", features = ["derive"] }
url         = "2.5"
regex       = "1.11"
once_cell   = "1.20"
config      = "0.14"
dotenvy     = "0.15"

# --- discord bot ----------------------------------------------------------
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
    "framework",
    "chrono",
] }
poise = "0.6"

# --- frontend (Leptos 0.8 - aligned with current ecosystem) ---------------
leptos          = { version = "0.8" }
leptos_axum     = { version = "0.8" }
leptos_meta     = { version = "0.8" }
leptos_router   = { version = "0.8" }
console_error_panic_hook = "0.1"
wasm-bindgen    = "=0.2.105"

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

# --- cargo-leptos workspace metadata --------------------------------------
[[workspace.metadata.leptos]]
name           = "gamecloud"
bin-package    = "gamecloud-web"
lib-package    = "gamecloud-web"
site-root      = "target/site"
site-pkg-dir   = "pkg"
style-file     = "crates/web/style/main.scss"
assets-dir     = "crates/web/assets"
site-addr      = "0.0.0.0:3000"
reload-port    = 3001
end2end-cmd    = "npx playwright test"
end2end-dir    = "end2end"
browserquery   = "defaults"
watch          = false
env            = "DEV"
bin-features   = ["ssr"]
bin-default-features = false
lib-features   = ["hydrate"]
lib-default-features = false
lib-profile-release  = "wasm-release"

[profile.wasm-release]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
