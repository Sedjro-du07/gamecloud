[package]
name        = "gamecloud-shared"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Shared types, models, and domain logic for GameCloud OS."

[lib]
name = "gamecloud_shared"
path = "src/lib.rs"

[features]
default = []
# Enable when the crate is consumed by a server (Axum / bot / migrations runner).
# This pulls in sqlx derives so models can be queried directly. The frontend
# (WASM target) builds without this feature.
server = ["dep:sqlx", "dep:chrono"]

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }
chrono     = { workspace = true, optional = true }
sqlx       = { workspace = true, optional = true }
